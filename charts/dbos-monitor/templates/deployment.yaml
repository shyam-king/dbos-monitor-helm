apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbos-monitor.fullname" . }}
  labels:
    {{- include "dbos-monitor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dbos-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dbos-monitor.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ required "A valid configMapName is required!" .Values.configMapName | quote }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
